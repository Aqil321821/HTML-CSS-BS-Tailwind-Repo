<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Pricing Card</title>
  </head>
  <body>
    <div class="container">
      <div class="row mt-5">
        <div class="col-md-6">
          <!-- Card A -->
          <div class="card border-0 shadow-lg mb-5 rounded-4">
            <div class="card-body">
              <div>
                <h4 class="fw-bold">Free</h4>
                <p class="text-muted">For Freelancers</p>
              </div>
              <h2 class="fs-1 fw-bold mt-4 mb-5">$0</h2>
              <ul class="list-group list-group-flush fs-5 mb-5 vstack gap-3">
                <li class="list-group-item border-0">
                  <i class="bi bi-check2"> Single User </i>
                </li>
                <li class="list-group-item border-0">
                  <i class="bi bi-check2"> 10 Downloads / Month </i>
                </li>
                <li class="list-group-item border-0">
                  <i class="bi bi-check2"> Faster Files </i>
                </li>
                <li class="list-group-item border-0">
                  <i class="bi bi-check2"> 20 Customs Pack </i>
                </li>
              </ul>
              <div class="d-grid">
                <button class="btn btn-dark mb-3 rounded-5">Subscribe</button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <!-- card B -->
          <div
            class="card border-0 shadow-lg mb-5 bg-dark text-white rounded-4"
          >
            <div class="card-body">
              <div>
                <h4 class="fw-bold">Premium</h4>
                <p class="text-white">For Agencies</p>
              </div>
              <h2 class="fs-1 fw-bold mt-4 mb-5">$10</h2>
              <ul class="list-group list-group-flush fs-5 mb-5 vstack gap-3">
                <li class="list-group-item border-0 bg-dark text-white">
                  <i class="bi bi-check2"> Unlimited Users </i>
                </li>
                <li class="list-group-item border-0 bg-dark text-white">
                  <i class="bi bi-check2"> Unlimited Downloads </i>
                </li>
                <li class="list-group-item border-0 bg-dark text-white">
                  <i class="bi bi-check2"> Faster Files </i>
                </li>
                <li class="list-group-item border-0 bg-dark text-white">
                  <i class="bi bi-check2"> 200+ Customs Pack </i>
                </li>
              </ul>
              <div class="d-grid">
                <button class="btn bg-white rounded-5 mb-3">Subscribe</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
